# Copy to watch.toml (ignored). Paths are relative to this file.
playlist_ids = "config/youtube-playlists.txt"
state_db = "environments/sandbox/state/watch.db"
ingest_config = "music-ingest.toml"
profile = "sandbox"
# Explicit opt-in, including when the scheduler passes --apply.
acquisition_enabled = false

[limits]
acquisitions = 10
file_bytes = 104857600
free_bytes = 2147483648

[navidrome]
enabled = false
url = "http://127.0.0.1:4534"
credentials_file = "state/navidrome-credentials.json"
music_root = "environments/sandbox/library"
# Navidrome returns virtual API paths. Mount its data directory READ ONLY to map
# API-visible song IDs to physical files, including its live WAL (never immutable).
# catalog_db = "/navidrome/navidrome.db"
library_id = 1
index_wait_seconds = 30

[lastfm]
enabled = false
username = "YOUR_PUBLIC_USERNAME"
api_key_file = "state/lastfm-api-key"

[listenbrainz]
enabled = false
username = "YOUR_PUBLIC_USERNAME"

[ranking]
blocked_artists = []
blocked_tracks = []
